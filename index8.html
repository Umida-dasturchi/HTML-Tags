<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Input Types Playground</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .form-container {
            background: #fff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            color: #616f70;
        }

        input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #4a90e2;
            outline: none;
        }

        .submit-row {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 1rem;
        }

        input[type="submit"],
        input[type="reset"],
        input[type="button"] {
            background: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
            padding: 0.7rem 1.5rem;
            border-radius: 0.5rem;
            margin: 0.3rem;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover,
        input[type="button"]:hover {
            background: #357ab8;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>All Input Types Playground</h1>
        <form>
            <div class="grid">
                <div class="field">
                    <label>Tugma</label>
                    <input type="button" value="Click Me">
                </div>
                <div class="field">
                    <label>Checkbox</label>
                    <input type="checkbox">
                </div>
                <div class="field">
                    <label>Rang</label>
                    <input type="color">
                </div>
                <div class="field">
                    <label>Data</label>
                    <input type="date">
                </div>
                <div class="field">
                    <label>DateTime-Local</label>
                    <input type="datetime-local">
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" placeholder="example@mail.com">
                </div>
                <div class="field">
                    <label>Fayl</label>
                    <input type="file">
                </div>
                <div class="field">
                    <label>Berkitilgan</label>
                    <input type="hidden" value="hiddenValue">
                </div>
                <div class="field">
                    <label>Image (as button)</label>
                    <input type="image" src="https://picsum.photos/id/1081/600/400" alt="">
                </div>
                <div class="field">
                    <label>Month</label>
                    <input type="month">
                </div>
                <div class="field">
                    <label>Number</label>
                    <input type="number" min="1" max="10">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" placeholder="••••••">
                </div>
                <div class="field">
                    <label>Radio</label>
                    <input type="radio" name="choice">
                </div>
                <div class="field">
                    <label>Range</label>
                    <input type="range" min="0" max="100">
                </div>
                <div class="field">
                    <label>Search</label>
                    <input type="search" placeholder="Poisk...">
                </div>
                <div class="field">
                    <label>Telephone</label>
                    <input type="tel" placeholder="+998 97 776 28 99">
                </div>
